# THROWAWAY — validation only, delete before merging.
#
# Mirrors the `build-ios` job from release-prebuilt.yml (minus preflight and
# upload) so the new target can be proven in isolation on a feature branch.
# ci.yml only watches main, so pushing here doesn't trigger it.
name: test-ios

on:
  push:
    branches: [feat/ios-prebuilt-target]

jobs:
  build-ios:
    name: iOS ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            platform_id: '2'
            platform_name: IOS
            smoke: false
          - target: aarch64-apple-ios-sim
            platform_id: '7'
            platform_name: IOSSIMULATOR
            smoke: true
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Environment report
        run: |
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true
          xcrun simctl list runtimes || true
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Merge static libs into single archive
        run: |
          set -euo pipefail
          builddir=$(ls -d target/${{ matrix.target }}/release/build/libchdman-rs-*/out | head -1)
          mkdir -p out
          name="libchdman_rs-${{ matrix.target }}.a"
          libtool -static -o "out/$name" "$builddir"/lib*.a
          (cd out && shasum -a 256 "$name" > "$name.sha256")
          ls -la out/
      - name: Validate archive
        run: scripts/validate-archive.sh "out/libchdman_rs-${{ matrix.target }}.a"
      - name: Confirm archive really targets iOS
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp "out/libchdman_rs-${{ matrix.target }}.a" "$work/lib.a"
          (cd "$work" && ar x lib.a)
          obj=$(find "$work" -name '*.o' | head -1)
          [ -n "$obj" ] || { echo "FAIL: no objects in archive"; exit 1; }
          plat=$(otool -l "$obj" | awk '/LC_BUILD_VERSION/{f=1} f && /platform/{print $2; exit}')
          echo "LC_BUILD_VERSION platform: $plat (expected ${{ matrix.platform_id }} / ${{ matrix.platform_name }})"
          case "$plat" in
            ${{ matrix.platform_id }}|${{ matrix.platform_name }}) echo "OK: archive targets ${{ matrix.platform_name }}" ;;
            *) echo "FAIL: archive reports platform '$plat', not ${{ matrix.platform_name }}"; exit 1 ;;
          esac
      - name: Boot an iOS simulator
        if: matrix.smoke
        run: |
          set -euo pipefail
          # Single-line python: a multi-line -c script would have to sit at
          # column 0 and would terminate this YAML block scalar.
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; f=[x for r,ds in d.items() if 'iOS' in r for x in ds if x.get('isAvailable')]; print(f[0]['udid'] if f else '')")
          if [ -z "$udid" ]; then
            echo "No preinstalled iOS simulator; creating one."
            runtime=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable') and 'iOS' in x['name']]; print(r[0]['identifier'] if r else '')")
            devtype=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin)['devicetypes'] if 'iPhone' in x['name']]; print(d[-1]['identifier'] if d else '')")
            [ -n "$runtime" ] && [ -n "$devtype" ] || {
              echo "FAIL: no iOS runtime/device type available on this runner"; exit 1; }
            udid=$(xcrun simctl create ci-iphone "$devtype" "$runtime")
          fi
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "Booted simulator $udid"
      - name: Smoke test — link prebuilt and run in the simulator
        if: matrix.smoke
        env:
          LIBCHDMAN_PREBUILT_LOCAL_ARCHIVE: ${{ github.workspace }}/out/libchdman_rs-${{ matrix.target }}.a
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER: xcrun simctl spawn booted
        run: |
          set -euo pipefail
          rm -rf target/${{ matrix.target }}/release/examples
          cargo run --release --features prebuilt --target ${{ matrix.target }} \
            --example check-prebuilt 2>&1 | tee smoke.log
          grep -q 'OK: archive is linked' smoke.log || {
            echo "FAIL: example did not report success (see smoke.log above)"; exit 1; }
      - name: Prove the smoke test can actually fail
        # Guards against a false green: if `simctl spawn` swallowed exit codes
        # AND the sentinel grep were wrong, the step above would pass no matter
        # what. Run a deliberately failing binary and require a non-zero status.
        if: matrix.smoke
        run: |
          set -euo pipefail
          cat > /tmp/failer.c <<'EOF'
          #include <stdio.h>
          int main(void) { printf("intentional failure\n"); return 7; }
          EOF
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          clang -target arm64-apple-ios13.0-simulator -isysroot "$SDK" \
            /tmp/failer.c -o /tmp/failer
          set +e
          xcrun simctl spawn booted /tmp/failer
          rc=$?
          set -e
          echo "exit code seen through simctl spawn: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: simctl spawn does not propagate exit codes — the smoke"
            echo "FAIL: test would pass even on a broken archive. The sentinel"
            echo "FAIL: grep is load-bearing; do not remove it."
            exit 1
          fi
          echo "OK: exit codes propagate ($rc), smoke test is meaningful"
