name: test-new-prebuilts (throwaway)

on:
  push:
    branches: [prebuilt-glibc231-musl]

jobs:
  # x86_64 glibc2.31 (Ubuntu 20.04 / Debian 11 / RHEL 9) the same way as armv7: an ubuntu:20.04
  # container, because the ubuntu-20.04 runner is gone. g++-10 is the oldest GCC that takes -std=c++20,
  # and it links 20.04's own libstdc++, so the archive needs nothing newer than the container has.
  build-linux-x86_64-glibc231:
    name: Linux x86_64-unknown-linux-gnu / glibc2.31
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates git file gcc g++ gcc-10 g++-10 binutils
      - name: Fix HOME for root user in container
        run: echo "HOME=/root" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          CC: gcc-10
          CXX: g++-10
        run: cargo build --release
      - name: Merge static libs into single archive
        shell: bash
        run: |
          set -euo pipefail
          builddir=$(ls -d target/release/build/libchdman-rs-*/out | head -1)
          mkdir -p out
          name="libchdman_rs-x86_64-unknown-linux-gnu-glibc2.31.a"
          { echo "create out/$name"; for f in "$builddir"/lib*.a; do echo "addlib $f"; done; echo save; echo end; } | ar -M
          ranlib "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256")
      - name: Validate archive
        run: scripts/validate-archive.sh "out/libchdman_rs-x86_64-unknown-linux-gnu-glibc2.31.a"
      - name: Smoke test — link prebuilt and run example
        env:
          LIBCHDMAN_PREBUILT_LOCAL_ARCHIVE: ${{ github.workspace }}/out/libchdman_rs-x86_64-unknown-linux-gnu-glibc2.31.a
        run: |
          rm -rf target/release/examples
          cargo run --release --features prebuilt --example check-prebuilt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-unknown-linux-gnu-glibc2.31
          path: out/*

  # musl: built natively on Alpine, with Alpine's static libstdc++ merged in, so a fully static
  # Rust musl binary links it with no musl C++ toolchain on the consumer's machine. Alpine runs via
  # `docker run` rather than `container:` because the runner's Node does not run on arm64 Alpine.
  build-linux-musl:
    name: Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runs_on: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and merge on Alpine
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src -e NAME="libchdman_rs-${{ matrix.target }}.a" alpine:3.20 sh -euc '
            apk add -q build-base curl git file
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
            . "$HOME/.cargo/env"
            CARGO_TARGET_DIR=/src/target-alpine cargo build --release
            builddir=$(ls -d target-alpine/release/build/libchdman-rs-*/out | head -1)
            mkdir -p out
            { echo "create out/$NAME"; for f in "$builddir"/lib*.a /usr/lib/libstdc++.a; do echo "addlib $f"; done; echo save; echo end; } | ar -M
            ranlib "out/$NAME"
            chown -R "$(stat -c %u:%g /src)" out target-alpine
          '
          (cd out && sha256sum "libchdman_rs-${{ matrix.target }}.a" > "libchdman_rs-${{ matrix.target }}.a.sha256")
      - name: Validate archive
        run: scripts/validate-archive.sh "out/libchdman_rs-${{ matrix.target }}.a"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The consumer's side: a glibc host with musl-tools links the archive into a static binary.
      - name: Smoke test — link prebuilt and run example
        env:
          LIBCHDMAN_PREBUILT_LOCAL_ARCHIVE: ${{ github.workspace }}/out/libchdman_rs-${{ matrix.target }}.a
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          cargo run --release --features prebuilt --target ${{ matrix.target }} --example check-prebuilt
          file target/${{ matrix.target }}/release/examples/check-prebuilt | grep -q 'static'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: out/*
